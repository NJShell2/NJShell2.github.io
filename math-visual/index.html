<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>See the Math</title>
<style>
:root{
  --ink:#1f2937; --muted:#6b7280; --paper:#fff8ef; --card:#ffffff;
  --blue:#3b82f6; --orange:#fb923c; --purple:#8b5cf6; --teal:#14b8a6;
  --teal-dark:#0f766e; --rose:#f43f5e; --amber:#f59e0b; --indigo:#6366f1;
}
*{box-sizing:border-box}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);margin:0;padding:20px 16px 48px;}
.wrap{max-width:780px;margin:0 auto;}
header{text-align:center;margin-bottom:8px;}
header h1{font-size:34px;margin:8px 0 4px;}
header p{color:var(--muted);margin:0 0 12px;}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;}
.opbtn{border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:10px 16px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);font-family:inherit;}
.opbtn.active{border-color:var(--ink);background:var(--ink);color:#fff;}
.frac-toggle{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0 2px;font-weight:700;}
.switch{position:relative;width:52px;height:28px;display:inline-block;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#d1d5db;border-radius:999px;transition:.2s;cursor:pointer;}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--purple);}
.switch input:checked + .slider:before{transform:translateX(24px);}
.inputs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:10px 0 4px;font-size:22px;font-weight:700;}
.inputs input{width:64px;font-size:22px;text-align:center;padding:8px;border:2px solid #e5e7eb;border-radius:10px;font-family:inherit;}
.inputs input:focus{outline:none;border-color:var(--ink);}
.frac-input{display:flex;flex-direction:column;align-items:center;gap:2px;}
.frac-input input{width:58px;}
.frac-bar-line{width:58px;height:3px;background:var(--ink);border-radius:2px;}
.opsym{font-size:30px;padding:0 4px;}
#concept{text-align:center;font-size:15px;color:var(--muted);margin:4px 0 0;}
#stage{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.07);padding:8px;margin:12px 0;}
#viz{width:100%;height:auto;display:block;}
#viz text{font-family:inherit;}
#equation{text-align:center;font-size:36px;font-weight:800;margin:10px 0 2px;}
#why{text-align:center;color:var(--muted);font-size:16px;max-width:640px;margin:6px auto 0;line-height:1.45;}
.replay{display:block;margin:12px auto 0;border:2px solid #e5e7eb;background:#fff;border-radius:12px;padding:8px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:26px;}
.pop{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;animation:pop .35s ease forwards;}
@keyframes pop{to{opacity:1;transform:scale(1);}}
.fadein{opacity:0;animation:fadein .5s ease forwards;}
@keyframes fadein{to{opacity:1;}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>See the Math</h1>
<p>Math you can look at, not just memorize.</p>
</header>
<div class="controls" id="opbtns">
  <button class="opbtn" data-op="add">+ Add</button>
  <button class="opbtn" data-op="sub">− Subtract</button>
  <button class="opbtn active" data-op="mul">× Multiply</button>
  <button class="opbtn" data-op="div">÷ Divide</button>
</div>
<div class="frac-toggle">
  <label class="switch"><input type="checkbox" id="fractoggle"><span class="slider"></span></label>
  <span>Fractions mode</span>
</div>
<div class="inputs" id="inputs"></div>
<p id="concept"></p>
<div id="stage"><svg id="viz" viewBox="0 0 640 400" role="img" aria-label="math visualization"></svg></div>
<div id="equation"></div>
<p id="why"></p>
<button class="replay" id="replay">Replay the picture</button>
<footer>Made for understanding, not memorizing.</footer>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const SYM={add:'+',sub:'−',mul:'×',div:'÷'};
const CONCEPT={
  add:'Addition puts groups together. Count everything and you have the total.',
  sub:'Subtraction takes a group away. What is left is the answer.',
  mul:'Multiplication is repeated addition: equal groups, counted fast. The grid shows every single one.',
  div:'Division splits into equal shares. The pie shows each share getting the same amount.'
};
const FCONCEPT={
  add:'You can only add pieces that are the same size. That is why we find a common denominator first.',
  sub:'Same rule as adding: make the pieces the same size, then take some away.',
  mul:'Multiplying fractions means taking a fraction OF a fraction. The overlapping area is the answer.',
  div:'Dividing fractions asks: how many of these fit inside that?'
};
const DEFAULTS={add:[4,3],sub:[7,3],mul:[4,3],div:[12,3]};
const FDEFAULTS={add:[1,2,1,4],sub:[3,4,1,4],mul:[1,2,2,3],div:[1,2,1,4]};
const state={op:'mul',frac:false,a:4,b:3,an:1,ad:2,bn:1,bd:4};

const gcd=(x,y)=>y?gcd(y,x%y):x;
const lcm=(x,y)=>x*y/gcd(x,y);
function simp(n,d){const g=gcd(Math.abs(n),d)||1;return [n/g,d/g];}
function fstr(n,d){return d===1?`${n}`:`${n}/${d}`;}
function S(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function text(svg,x,y,str,size,weight,fill,anchor){
  const t=S('text',{x:x,y:y,'font-size':size||18,'font-weight':weight||600,fill:fill||'#1f2937','text-anchor':anchor||'start',class:'fadein'},svg);
  t.textContent=str;return t;
}
function clearSVG(){const svg=document.getElementById('viz');svg.innerHTML='';return svg;}

function inputCfg(){
  switch(state.op){
    case 'add': return [{min:0,max:12},{min:0,max:12}];
    case 'sub': return [{min:1,max:12},{min:0,max:12}];
    case 'mul': return [{min:1,max:10},{min:1,max:10}];
    case 'div': return [{min:2,max:12},{min:2,max:6}];
  }
}
function numInput(key,val,cfg){
  const i=document.createElement('input');
  i.type='number';i.inputMode='numeric';i.min=cfg.min;i.max=cfg.max;i.value=val;
  i.setAttribute('aria-label',key==='a'?'first number':'second number');
  i.addEventListener('change',()=>{
    let v=parseInt(i.value,10);if(isNaN(v))v=cfg.min;
    v=Math.max(cfg.min,Math.min(cfg.max,v));
    if(state.op==='sub'&&key==='b')v=Math.min(v,state.a);
    if(state.op==='sub'&&key==='a')v=Math.max(v,state.b);
    state[key]=v;i.value=v;render();
  });
  return i;
}
function fracInput(nk,dk,nv,dv){
  const w=document.createElement('div');w.className='frac-input';
  const n=document.createElement('input');n.type='number';n.inputMode='numeric';n.min=0;n.max=12;n.value=nv;n.setAttribute('aria-label','numerator');
  const bar=document.createElement('div');bar.className='frac-bar-line';
  const d=document.createElement('input');d.type='number';d.inputMode='numeric';d.min=1;d.max=12;d.value=dv;d.setAttribute('aria-label','denominator');
  const upd=()=>{
    let nn=Math.max(0,Math.min(12,parseInt(n.value,10)||0));
    let dd=Math.max(1,Math.min(12,parseInt(d.value,10)||1));
    if(state.op==='div'&&nk==='bn')nn=Math.max(1,nn);
    state[nk]=nn;state[dk]=dd;n.value=nn;d.value=dd;render();
  };
  n.addEventListener('change',upd);d.addEventListener('change',upd);
  w.appendChild(n);w.appendChild(bar);w.appendChild(d);return w;
}
function renderInputs(){
  const box=document.getElementById('inputs');box.innerHTML='';
  const s=document.createElement('span');s.className='opsym';s.textContent=SYM[state.op];
  if(!state.frac){
    const cfg=inputCfg();
    box.appendChild(numInput('a',state.a,cfg[0]));
    box.appendChild(s);
    box.appendChild(numInput('b',state.b,cfg[1]));
  }else{
    box.appendChild(fracInput('an','ad',state.an,state.ad));
    box.appendChild(s);
    box.appendChild(fracInput('bn','bd',state.bn,state.bd));
  }
}

function drawAdd(svg,a,b){
  const s=34,g=8,perRow=12,x0=60;
  let delay=0;
  const cell=(x,y,fill,d)=>{S('rect',{x:x,y:y,width:s,height:s,rx:8,fill:fill,class:'pop',style:`animation-delay:${d}ms`},svg);};
  text(svg,x0,44,`${a} blue`,'20','700','#3b82f6');
  for(let i=0;i<a;i++){const c=i%perRow,r=Math.floor(i/perRow);cell(x0+c*(s+g),64+r*(s+g),'#3b82f6',delay);delay+=40;}
  const rowsA=Math.ceil(a/perRow)||1;
  text(svg,x0,64+rowsA*(s+g)+30,'+','26','700','#6b7280');
  const yB=64+rowsA*(s+g)+48;
  text(svg,x0,yB-18,`${b} orange`,'20','700','#fb923c');
  for(let i=0;i<b;i++){const c=i%perRow,r=Math.floor(i/perRow);cell(x0+c*(s+g),yB+r*(s+g),'#fb923c',delay);delay+=40;}
  const rowsB=Math.ceil(b/perRow)||1;
  const yC=yB+rowsB*(s+g)+44;
  text(svg,x0,yC-18,`put together = ${a+b}`,'20','800','#1f2937');
  for(let i=0;i<a+b;i++){const c=i%perRow,r=Math.floor(i/perRow);cell(x0+c*(s+g),yC+r*(s+g),i<a?'#3b82f6':'#fb923c',delay);delay+=25;}
}

function drawSub(svg,a,b){
  b=Math.min(b,a);
  const s=40,g=10,perRow=10,x0=70,y0=92;
  let delay=0;
  text(svg,x0,y0-26,`${a} to start`,'20','700','#6366f1');
  for(let i=0;i<a;i++){
    const c=i%perRow,r=Math.floor(i/perRow);
    const x=x0+c*(s+g),y=y0+r*(s+g);
    const gone=i>=a-b;
    S('rect',{x:x,y:y,width:s,height:s,rx:9,fill:gone?'#fee2e2':'#6366f1',class:'pop',style:`animation-delay:${delay}ms`,opacity:gone?0.55:1},svg);
    if(gone){
      S('line',{x1:x+9,y1:y+9,x2:x+s-9,y2:y+s-9,stroke:'#f43f5e','stroke-width':5,'stroke-linecap':'round',class:'pop',style:`animation-delay:${delay+120}ms`},svg);
      S('line',{x1:x+s-9,y1:y+9,x2:x+9,y2:y+s-9,stroke:'#f43f5e','stroke-width':5,'stroke-linecap':'round',class:'pop',style:`animation-delay:${delay+120}ms`},svg);
    }
    delay+=45;
  }
  const rows=Math.ceil(a/perRow)||1;
  text(svg,x0,y0+rows*(s+g)+36,`${b} taken away → ${a-b} left`,'22','800','#1f2937');
}
function drawMul(svg,a,b){
  const gap=6;
  const s=Math.floor(Math.min(46,(380-(a-1)*gap)/a,(250-(b-1)*gap)/b));
  const W=a*s+(a-1)*gap,H=b*s+(b-1)*gap;
  const x0=(640-W)/2,y0=96;
  let delay=0;
  text(svg,320,58,`${a} columns × ${b} rows`,'20','700','#6b7280','middle');
  for(let r=0;r<b;r++)for(let c=0;c<a;c++){
    S('rect',{x:x0+c*(s+gap),y:y0+r*(s+gap),width:s,height:s,rx:7,fill:(r+c)%2?'#fbbf24':'#f59e0b',class:'pop',style:`animation-delay:${delay}ms`},svg);
    delay+=35;
  }
  text(svg,320,y0+H+40,`${a} × ${b} = ${a*b}`,'26','800','#1f2937','middle');
}

function drawDiv(svg,a,b){
  const q=Math.floor(a/b),r=a%b;
  const cx=205,cy=195,R=128;
  const sec=2*Math.PI/b;
  for(let i=0;i<b;i++){
    const a0=-Math.PI/2+i*sec,a1=a0+sec;
    const p=`M ${cx} ${cy} L ${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)} A ${R} ${R} 0 0 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)} Z`;
    S('path',{d:p,fill:i%2?'#99f6e4':'#5eead4',stroke:'#ffffff','stroke-width':3,class:'fadein'},svg);
  }
  let delay=200;
  for(let s2=0;s2<b;s2++){
    for(let j=0;j<q;j++){
      const row=Math.floor(j/3),col=j%3;
      const ang=-Math.PI/2+s2*sec+sec*(0.24+0.26*col);
      const rad=46+row*30;
      const x=cx+rad*Math.cos(ang),y=cy+rad*Math.sin(ang);
      S('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:9,fill:'#0f766e',class:'pop',style:`animation-delay:${delay}ms`},svg);
      delay+=60;
    }
    const mid=-Math.PI/2+s2*sec+sec/2;
    text(svg,(cx+106*Math.cos(mid)).toFixed(1),(cy+106*Math.sin(mid)).toFixed(1),`${q}`,'20','800','#0f766e','middle');
  }
  if(r>0){
    text(svg,470,120,`left over: ${r}`,'20','700','#6b7280','middle');
    for(let i=0;i<r;i++){
      S('circle',{cx:440+i*34,cy:160,r:11,fill:'#f43f5e',class:'pop',style:`animation-delay:${delay}ms`},svg);
      delay+=80;
    }
  }else{
    text(svg,470,150,'no leftovers','20','700','#6b7280','middle');
  }
  text(svg,470,260,`${a} ÷ ${b}`,'24','800','#1f2937','middle');
  text(svg,470,292,'= '+q+(r?` remainder ${r}`:''),'24','800','#1f2937','middle');
  return {q:q,r:r};
}

function fracBar(svg,x,y,w,h,segs,shaded,fill,delay){
  for(let i=0;i<segs;i++){
    S('rect',{x:(x+i*(w/segs)).toFixed(1),y:y,width:(w/segs-2).toFixed(1),height:h,rx:6,fill:i<shaded?fill:'#e5e7eb',class:'pop',style:`animation-delay:${delay+i*60}ms`},svg);
  }
  S('rect',{x:x,y:y,width:w,height:h,rx:8,fill:'none',stroke:'#1f2937','stroke-width':2},svg);
}

function drawFracAdd(svg,an,ad,bn,bd){
  const L=lcm(ad,bd),sa=an*L/ad,sb=bn*L/bd,st=sa+sb;
  const x=90,w=460;
  text(svg,x,52,`${an}/${ad}  =  ${sa}/${L}`,'18','700','#3b82f6');
  fracBar(svg,x,64,w,44,L,sa,'#3b82f6',100);
  text(svg,x,152,`${bn}/${bd}  =  ${sb}/${L}`,'18','700','#fb923c');
  fracBar(svg,x,164,w,44,L,sb,'#fb923c',400);
  text(svg,x,262,'put together:','18','700','#6b7280');
  let y=274,rem=st,bars=0;
  if(st===0){fracBar(svg,x,y,w,44,L,0,'#8b5cf6',700);}
  while(rem>0&&bars<3){const sh=Math.min(rem,L);fracBar(svg,x,y,w,44,L,sh,'#8b5cf6',700+bars*300);rem-=L;y+=64;bars++;}
  const s=simp(st,L);
  return {
    eq:`${an}/${ad} + ${bn}/${bd} = ${fstr(s[0],s[1])}`,
    why:`Pieces have to be the same size before you add them. ${an}/${ad} becomes ${sa} pieces of size 1/${L}, plus ${sb} more. Count the shaded pieces: ${fstr(s[0],s[1])}.`
  };
}

function drawFracSub(svg,an,ad,bn,bd){
  const L=lcm(ad,bd),sa=an*L/ad,sb=bn*L/bd;
  const x=90,w=460;
  text(svg,x,52,`${an}/${ad}  =  ${sa}/${L}`,'18','700','#3b82f6');
  fracBar(svg,x,64,w,44,L,sa,'#3b82f6',100);
  text(svg,x,152,`take away ${bn}/${bd}  =  ${sb}/${L}`,'18','700','#f43f5e');
  for(let i=0;i<L;i++){
    const bx=x+i*(w/L);
    S('rect',{x:bx.toFixed(1),y:164,width:(w/L-2).toFixed(1),height:44,rx:6,fill:i<sb?'#fecdd3':'#e5e7eb',class:'pop',style:`animation-delay:${400+i*60}ms`},svg);
    if(i<sb){
      S('line',{x1:(bx+10).toFixed(1),y1:174,x2:(bx+w/L-12).toFixed(1),y2:198,stroke:'#f43f5e','stroke-width':5,'stroke-linecap':'round',class:'pop',style:`animation-delay:${500+i*60}ms`},svg);
      S('line',{x1:(bx+w/L-12).toFixed(1),y1:174,x2:(bx+10).toFixed(1),y2:198,stroke:'#f43f5e','stroke-width':5,'stroke-linecap':'round',class:'pop',style:`animation-delay:${500+i*60}ms`},svg);
    }
  }
  S('rect',{x:x,y:164,width:w,height:44,rx:8,fill:'none',stroke:'#1f2937','stroke-width':2},svg);
  const diff=sa-sb;
  const s=simp(diff,L);
  text(svg,x,262,'what is left:','18','700','#6b7280');
  if(diff>0){fracBar(svg,x,274,w,44,L,diff,'#8b5cf6',800);}
  else if(diff===0){fracBar(svg,x,274,w,44,L,0,'#8b5cf6',800);}
  else{text(svg,x,306,'nothing left, it went below zero','18','700','#f43f5e');}
  return {
    eq:`${an}/${ad} − ${bn}/${bd} = ${fstr(s[0],s[1])}`,
    why:diff>=0
      ?`Same size pieces, then take some away. ${sa} pieces minus ${sb} pieces leaves ${diff}: ${fstr(s[0],s[1])}.`
      :`You tried to take ${sb} pieces from only ${sa}. That goes below zero, so the answer is negative: ${fstr(s[0],s[1])}.`
  };
}
function drawFracMul(svg,an,ad,bn,bd){
  const SZ=300,x0=70,y0=58;
  for(let i=0;i<bd;i++){
    S('rect',{x:(x0+i*SZ/bd).toFixed(1),y:y0,width:(SZ/bd-2).toFixed(1),height:SZ,rx:4,fill:i<bn?'#fb923c':'#f3f4f6',opacity:i<bn?0.45:1,class:'pop',style:`animation-delay:${100+i*80}ms`},svg);
  }
  for(let j=0;j<ad;j++){
    S('rect',{x:x0,y:(y0+j*SZ/ad).toFixed(1),width:SZ,height:(SZ/ad-2).toFixed(1),rx:4,fill:j<an?'#3b82f6':'none',opacity:j<an?0.35:1,class:'pop',style:`animation-delay:${300+j*80}ms`},svg);
  }
  for(let i=0;i<bn;i++)for(let j=0;j<an;j++){
    S('rect',{x:(x0+i*SZ/bd).toFixed(1),y:(y0+j*SZ/ad).toFixed(1),width:(SZ/bd-3).toFixed(1),height:(SZ/ad-3).toFixed(1),rx:4,fill:'#8b5cf6',class:'pop',style:`animation-delay:${700+(i*an+j)*90}ms`},svg);
  }
  S('rect',{x:x0,y:y0,width:SZ,height:SZ,rx:8,fill:'none',stroke:'#1f2937','stroke-width':2.5},svg);
  const pn=an*bn,pd=ad*bd,sp=simp(pn,pd);
  text(svg,410,116,`${an}/${ad} of the height`,'17','700','#3b82f6');
  text(svg,410,146,`${bn}/${bd} of the width`,'17','700','#fb923c');
  text(svg,410,186,`overlap = ${pn}/${pd}`,'17','700','#8b5cf6');
  text(svg,410,218,`= ${fstr(sp[0],sp[1])}`,'20','800','#1f2937');
  return {
    eq:`${an}/${ad} × ${bn}/${bd} = ${fstr(sp[0],sp[1])}`,
    why:`"Of" means multiply. Shade ${an}/${ad} going down and ${bn}/${bd} going across. Where they overlap is the answer: ${pn} little pieces out of ${pd}.`
  };
}

function drawFracDiv(svg,an,ad,bn,bd){
  if(bn===0){
    text(svg,320,200,"Can't divide by zero!",'24','800','#f43f5e','middle');
    return {eq:'—',why:'Dividing by zero is not allowed, not even with fractions.'};
  }
  const v1=an/ad,v2=bn/bd;
  const x=80,w=480,y=130,h=56;
  S('rect',{x:x,y:y,width:w,height:h,rx:10,fill:'#f3f4f6',stroke:'#1f2937','stroke-width':2},svg);
  if(v1>0){S('rect',{x:x,y:y,width:(w*v1).toFixed(1),height:h,rx:10,fill:'#3b82f6',opacity:0.75,class:'fadein'},svg);}
  const full=Math.floor(v1/v2+1e-9);
  for(let k=1;k*v2<v1+1e-9;k++){
    const tx=x+w*k*v2;
    S('line',{x1:tx.toFixed(1),y1:y-8,x2:tx.toFixed(1),y2:y+h+8,stroke:'#f43f5e','stroke-width':4,'stroke-linecap':'round',class:'pop',style:`animation-delay:${300+k*150}ms`},svg);
    if(k<=full){text(svg,(tx-w*v2/2).toFixed(1),y+h+36,`${k}`,'18','800','#f43f5e','middle');}
  }
  text(svg,x,y-18,`${an}/${ad} of a whole`,'18','700','#3b82f6');
  text(svg,x+w,y-18,`each red mark = ${bn}/${bd}`,'18','700','#f43f5e','end');
  const n=an*bd,d=ad*bn,sp=simp(n,d);
  const leftover=v1-full*v2;
  return {
    eq:`${an}/${ad} ÷ ${bn}/${bd} = ${fstr(sp[0],sp[1])}`,
    why:`How many ${bn}/${bd} fit inside ${an}/${ad}? Count the red marks: ${full} full ${full===1?'piece':'pieces'}`+(leftover>1e-9?' plus a little extra.':'.')
  };
}

function render(){
  const svg=clearSVG();
  document.getElementById('concept').textContent=state.frac?FCONCEPT[state.op]:CONCEPT[state.op];
  document.querySelectorAll('.opbtn').forEach(b=>b.classList.toggle('active',b.dataset.op===state.op));
  let eq='',why='';
  if(!state.frac){
    const a=state.a,b=state.b;
    if(state.op==='add'){
      drawAdd(svg,a,b);
      eq=`${a} + ${b} = ${a+b}`;
      why=`${a} blue blocks join ${b} orange blocks. Put the groups together and count: ${a+b}.`;
    }else if(state.op==='sub'){
      drawSub(svg,a,b);
      eq=`${a} − ${b} = ${a-b}`;
      why=`Start with ${a}. Cross out ${b}. ${a-b} ${a-b===1?'is':'are'} left.`;
    }else if(state.op==='mul'){
      drawMul(svg,a,b);
      eq=`${a} × ${b} = ${a*b}`;
      why=`${a} × ${b} means ${a} groups of ${b}. The grid has ${b} ${b===1?'row':'rows'} of ${a}: count every cell and you get ${a*b}.`;
    }else{
      const r=drawDiv(svg,a,b);
      eq=`${a} ÷ ${b} = ${r.q}`+(r.r?` remainder ${r.r}`:'');
      why=`Split ${a} into ${b} equal shares. Each share gets ${r.q}.`+(r.r?` ${r.r} ${r.r===1?'is':'are'} left over.`:' Nothing left over.');
    }
  }else{
    const an=state.an,ad=state.ad,bn=state.bn,bd=state.bd;
    let res;
    if(state.op==='add')res=drawFracAdd(svg,an,ad,bn,bd);
    else if(state.op==='sub')res=drawFracSub(svg,an,ad,bn,bd);
    else if(state.op==='mul')res=drawFracMul(svg,an,ad,bn,bd);
    else res=drawFracDiv(svg,an,ad,bn,bd);
    eq=res.eq;why=res.why;
  }
  document.getElementById('equation').textContent=eq;
  document.getElementById('why').textContent=why;
}

document.querySelectorAll('.opbtn').forEach(b=>b.addEventListener('click',()=>{
  state.op=b.dataset.op;
  if(!state.frac){const d=DEFAULTS[state.op];state.a=d[0];state.b=d[1];}
  else{const d=FDEFAULTS[state.op];state.an=d[0];state.ad=d[1];state.bn=d[2];state.bd=d[3];}
  renderInputs();render();
}));
document.getElementById('fractoggle').addEventListener('change',e=>{
  state.frac=e.target.checked;
  if(state.frac){const d=FDEFAULTS[state.op];state.an=d[0];state.ad=d[1];state.bn=d[2];state.bd=d[3];}
  else{const d=DEFAULTS[state.op];state.a=d[0];state.b=d[1];}
  renderInputs();render();
});
document.getElementById('replay').addEventListener('click',render);
renderInputs();
render();
</script>
</body>
</html>
